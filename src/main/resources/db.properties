# ==========================================================
# Azani ISP Information System - Database Configuration
# ==========================================================
# Available db.type options: supabase, mysql, h2
# Change db.type to 'supabase' once you enter your Supabase details below:
db.type=h2
db.auto_fallback=true

# --- Supabase Settings (Cloud PostgreSQL) ---
# In Supabase: Project Settings -> Database -> Connection Info
db.host=db.YOUR_PROJECT_REF.supabase.co
db.port=5432
db.name=postgres
db.user=postgres
db.password=YOUR_SUPABASE_DB_PASSWORD

# Optional: Full JDBC connection string (Uncomment and paste if preferred)
# db.url=jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?sslmode=require
